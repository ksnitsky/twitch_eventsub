name = "twitch_eventsub"
version = "0.1.1"
description = "A robust Twitch EventSub WebSocket client library for Gleam with auto-reconnect and keepalive monitoring."
licences = ["Apache-2.0"]
repository = { type = "github", user = "ksnitsky", repo = "twitch_eventsub" }
links = [
  { title = "Hex", href = "https://hex.pm/packages/twitch_eventsub" },
  { title = "API Docs", href = "https://hexdocs.pm/twitch_eventsub" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
stratus = ">= 3.0.0"
gleam_http = ">= 4.0.0"
gleam_httpc = ">= 5.0.0"
gleam_json = ">= 3.0.0"
gleam_otp = ">= 1.0.0"
gleam_erlang = ">= 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
mist = ">= 4.0.0"

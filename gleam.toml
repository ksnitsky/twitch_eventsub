name = "gwitchel"
version = "0.1.0"
description = "A robust Twitch EventSub WebSocket client library for Gleam with auto-reconnect and keepalive monitoring."
licences = ["Apache-2.0"]
repository = { type = "github", user = "ksnitsky", repo = "gwitchel" }
links = [
  { title = "Hex", href = "https://hex.pm/packages/gwitchel" },
  { title = "API Docs", href = "https://hexdocs.pm/gwitchel" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
stratus = ">= 3.0.0"
gleam_http = ">= 4.0.0"
gleam_httpc = ">= 5.0.0"
gleam_json = ">= 3.0.0"
gleam_otp = ">= 1.0.0"
gleam_erlang = ">= 1.0.0"
logging = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
